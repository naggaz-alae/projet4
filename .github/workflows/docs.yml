name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "mkdocs.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - name: Construction et publication sur GitHub Pages (branche gh-pages)
        run: mkdocs gh-deploy --force
