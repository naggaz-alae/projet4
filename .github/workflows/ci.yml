name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["donnees/**"]     # les commits quotidiens de la veille ne relancent pas la CI
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff (PEP 8, bugs probables, imports)
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy --strict
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,pandas]"
      - name: pytest + couverture (minimum 90 %)
        run: pytest --cov --cov-report=term-missing

  paquet:
    name: Construction du paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Vérification des métadonnées PyPI
        run: twine check --strict dist/*
