[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "veille-ruptures"
dynamic = ["version"]
description = "Surveiller les ruptures et tensions d'approvisionnement de médicaments en France (données ANSM)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alae-eddine Naggaz" }]
keywords = ["médicaments", "ruptures", "ANSM", "BDPM", "santé", "open data", "pharmacie"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = ["click>=8.2"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
veille-ruptures = "veille_ruptures.cli:main"

[project.urls]
Documentation = "https://naggaz-alae.github.io/projet4/"
Source = "https://github.com/naggaz-alae/projet4"
Issues = "https://github.com/naggaz-alae/projet4/issues"
Changelog = "https://github.com/naggaz-alae/projet4/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/veille_ruptures/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/veille_ruptures"]

[tool.hatch.build.targets.sdist]
exclude = ["/donnees", "/.github"]

# ---------------------------------------------------------------- qualité

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # style PEP 8
    "F",        # erreurs (imports inutilisés, noms inconnus…)
    "I",        # tri des imports
    "B",        # bugs probables
    "UP",       # syntaxe Python moderne
    "SIM",      # simplifications
    "C4",       # compréhensions
    "PT",       # bonnes pratiques pytest
    "RUF",      # règles spécifiques à ruff
]
# Les textes en français contiennent légitimement « », ’ et –
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas"]              # dépendance optionnelle, sans annotations de type
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["veille_ruptures"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
